org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Java toolchain: left unset so Gradle uses JAVA_HOME (or the Android Studio
# bundled JBR when invoked via build-onboard.bat, which sets JAVA_HOME for the
# session). Commented value below is the previous Windows-only default; restore
# it only if you want to pin the toolchain regardless of JAVA_HOME.
# org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true

